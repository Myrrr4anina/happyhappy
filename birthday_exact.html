<text x="54" y="178" textLength="102" lengthAdjust="spacingAndGlyphs" class="g">THIS DAY IS ALL ABOUT YOU</text>
<text x="53" y="202" textLength="300" lengthAdjust="spacingAndGlyphs" class="h">С днём рождения, Катюша!</text>
<text x="55.7" y="218" textLength="221.6" lengthAdjust="spacingAndGlyphs" class="b">Ну что, мошенница, ещё на один год стала старше!</text><text x="55.7" y="228" textLength="227.0" lengthAdjust="spacingAndGlyphs" class="b">Надеюсь, Вы осознаёте всю серьёзность происходящего.</text><text x="55.7" y="238" textLength="342.6" lengthAdjust="spacingAndGlyphs" class="b">19 лет — это уже почти взрослый человек. Почти. Не будем торопиться с выводами.</text><text x="55.7" y="255" textLength="286.0" lengthAdjust="spacingAndGlyphs" class="b">Желаю тебе побольше поводов улыбаться, сил на все задумки и мечты,</text><text x="55.7" y="265" textLength="292.6" lengthAdjust="spacingAndGlyphs" class="b">которые ты обязательно воплотишь в жизнь. Оставайся такой же яркой,</text><text x="55.7" y="274.5" textLength="214.3" lengthAdjust="spacingAndGlyphs" class="b">энергичной, позитивной и невероятно трудолюбивой!</text><text x="55.7" y="290" textLength="324.3" lengthAdjust="spacingAndGlyphs" class="b">Пусть рядом будут хорошие люди, планы превращаются в приятную реальность,</text><text x="55.7" y="299" textLength="306.0" lengthAdjust="spacingAndGlyphs" class="b">а каждый новый день приносит что-нибудь интересное. И пусть даже самые</text><text x="55.7" y="308" textLength="201.0" lengthAdjust="spacingAndGlyphs" class="b">смелые мечты не боятся становиться настоящими.</text><text x="55.7" y="323" textLength="206.0" lengthAdjust="spacingAndGlyphs" class="b">В общем, с праздником тебя! Не теряй свой задор,</text><text x="55.7" y="332.5" textLength="204.3" lengthAdjust="spacingAndGlyphs" class="b">продолжай радовать этот мир своим присутствием</text><text x="55.7" y="341.5" textLength="149.3" lengthAdjust="spacingAndGlyphs" class="b">и, пожалуйста, поменьше мошенничай.</text>
</svg>
<button id="go" aria-label="Запустить праздник"></button>
</div>
<canvas id="c"></canvas>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),P=[],run=false;
function sz(){c.width=innerWidth;c.height=innerHeight}sz();addEventListener('resize',sz);
var cols=['#b8183f','#e8587c','#f3b8be','#7a1230','#fff','#ff8fa3'];
function f(){x.clearRect(0,0,c.width,c.height);
P.forEach(function(p){p.y+=p.vy;p.x+=p.vx;p.r+=p.vr;p.vy+=.22;p.vx*=.99;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
if(p.h){x.font=p.s*2+'px serif';x.fillText('♥',0,0)}else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
P=P.filter(function(p){return p.y<c.height+30});
if(P.length)requestAnimationFrame(f);else run=false}
document.getElementById('go').addEventListener('click',function(){
for(var k=0;k<160;k++){var a=-Math.PI/2+(Math.random()-.5)*1.8,v=9+Math.random()*10;P.push({x:c.width/2,y:c.height,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:6+Math.random()*8,c:cols[k%cols.length],h:k%5===0});}
for(var i=0;i<180;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*250,vx:(Math.random()-.5)*2,vy:Math.random()*2+1,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:6+Math.random()*8,c:cols[i%cols.length],h:i%5===0});
if(!run){run=true;f()}});
})();
</script></body></html>
